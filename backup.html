<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IT Asset Management</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Navigaatio -->
    <header>
        <nav class="navbar">
            <div class="logo">IT Assets</div>

            <ul class="nav-links">
                <li>
                    <a href="#" id="nav-dashboard" class="active">
                        Dashboard
                    </a>
                </li>
                <li>
                    <a href="#" id="nav-devices">Laitteet</a>
                </li>
                <li>
                    <a href="#" id="nav-users">Käyttäjät</a>
                </li>
                <li>
                    <a href="#" id="nav-licenses">Lisenssit</a>
                </li>
            </ul>
        </nav>
    </header>

    <!-- Sovelluksen näkymät luodaan JavaScriptillä -->
    <main id="app-content" class="container my-4">
        <h1>IT Asset Management</h1>
        <p>Tervetuloa IT-omaisuuden hallintaan.</p>
    </main>

    <!-- LAITTEEN LISÄYS -->
    <div
        class="modal fade"
        id="addDeviceModal"
        tabindex="-1"
        aria-labelledby="addDeviceModalLabel"
        aria-hidden="true"
    >
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">

                <div class="modal-header bg-dark text-white">
                    <h2 class="modal-title fs-5" id="addDeviceModalLabel">
                        Lisää uusi IT-laite
                    </h2>
                    <button
                        type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal"
                        aria-label="Sulje"
                    ></button>
                </div>

                <div class="modal-body">
                    <form id="form-add-device">

                        <div class="mb-3">
                            <label for="device-type" class="form-label">
                                Laitetyyppi *
                            </label>
                            <select id="device-type" class="form-select" required>
                                <option value="" disabled selected>
                                    Valitse tyyppi...
                                </option>
                                <option value="Tietokone">Tietokone</option>
                                <option value="Puhelin">Puhelin</option>
                                <option value="Tabletti">Tabletti</option>
                                <option value="Muu">Muu laite</option>
                            </select>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="device-vendor" class="form-label">
                                    Valmistaja *
                                </label>
                                <input
                                    type="text"
                                    id="device-vendor"
                                    class="form-control"
                                    required
                                    placeholder="esim. Lenovo"
                                >
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="device-model" class="form-label">
                                    Malli *
                                </label>
                                <input
                                    type="text"
                                    id="device-model"
                                    class="form-control"
                                    required
                                    placeholder="esim. ThinkPad"
                                >
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="device-serial" class="form-label">
                                Sarjanumero *
                            </label>
                            <input
                                type="text"
                                id="device-serial"
                                class="form-control"
                                required
                                placeholder="esim. SN-12345"
                            >
                        </div>

                        <div class="mb-3">
                            <label for="device-user" class="form-label">
                                Käyttäjä
                            </label>
                            <input
                                type="text"
                                id="device-user"
                                class="form-control"
                                placeholder="esim. Matti Meikäläinen"
                            >
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="device-status" class="form-label">
                                    Tila *
                                </label>
                                <select id="device-status" class="form-select" required>
                                    <option value="Käytössä">Käytössä</option>
                                    <option value="Varastossa" selected>
                                        Varastossa
                                    </option>
                                    <option value="Huollossa">Huollossa</option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="device-price" class="form-label">
                                    Hinta (€)
                                </label>
                                <input
                                    type="number"
                                    id="device-price"
                                    class="form-control"
                                    min="0"
                                    step="0.01"
                                >
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="device-purchase" class="form-label">
                                    Hankintapäivä
                                </label>
                                <input
                                    type="date"
                                    id="device-purchase"
                                    class="form-control"
                                >
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="device-warranty" class="form-label">
                                    Takuu päättyy
                                </label>
                                <input
                                    type="date"
                                    id="device-warranty"
                                    class="form-control"
                                >
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="device-info" class="form-label">
                                Lisätietoja
                            </label>
                            <textarea
                                id="device-info"
                                class="form-control"
                                rows="2"
                            ></textarea>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <button
                                type="button"
                                class="btn btn-secondary"
                                data-bs-dismiss="modal"
                            >
                                Peruuta
                            </button>
                            <button type="submit" class="btn btn-primary">
                                Tallenna laite
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- KÄYTTÄJÄN LISÄYS -->
    <div
        class="modal fade"
        id="userModal"
        tabindex="-1"
        aria-labelledby="userModalLabel"
        aria-hidden="true"
    >
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header bg-dark text-white">
                    <h2 class="modal-title fs-5" id="userModalLabel">
                        Lisää uusi käyttäjä
                    </h2>
                    <button
                        type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal"
                        aria-label="Sulje"
                    ></button>
                </div>

                <div class="modal-body">
                    <form id="form-user">

                        <div class="mb-3">
                            <label for="user-name" class="form-label">
                                Koko nimi *
                            </label>
                            <input
                                type="text"
                                id="user-name"
                                class="form-control"
                                maxlength="100"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="user-email" class="form-label">
                                Sähköposti *
                            </label>
                            <input
                                type="email"
                                id="user-email"
                                class="form-control"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="user-department" class="form-label">
                                Osasto
                            </label>
                            <input
                                type="text"
                                id="user-department"
                                class="form-control"
                            >
                        </div>

                        <div class="mb-3">
                            <label for="user-role" class="form-label">
                                Tehtävänimike
                            </label>
                            <input
                                type="text"
                                id="user-role"
                                class="form-control"
                            >
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <button
                                type="button"
                                class="btn btn-secondary"
                                data-bs-dismiss="modal"
                            >
                                Peruuta
                            </button>
                            <button type="submit" class="btn btn-primary">
                                Tallenna käyttäjä
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- LISENSSIN LISÄYS -->
    <div
        class="modal fade"
        id="licenseModal"
        tabindex="-1"
        aria-labelledby="licenseModalLabel"
        aria-hidden="true"
    >
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header bg-dark text-white">
                    <h2 class="modal-title fs-5" id="licenseModalLabel">
                        Lisää ohjelmistolisenssi
                    </h2>
                    <button
                        type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal"
                        aria-label="Sulje"
                    ></button>
                </div>

                <div class="modal-body">
                    <form id="form-license">

                        <div class="mb-3">
                            <label for="license-name" class="form-label">
                                Ohjelmiston nimi *
                            </label>
                            <input
                                type="text"
                                id="license-name"
                                class="form-control"
                                maxlength="100"
                                required
                                placeholder="esim. Microsoft 365"
                            >
                        </div>

                        <div class="mb-3">
                            <label for="license-vendor" class="form-label">
                                Toimittaja *
                            </label>
                            <input
                                type="text"
                                id="license-vendor"
                                class="form-control"
                                required
                                placeholder="esim. Microsoft"
                            >
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="license-total" class="form-label">
                                    Lisenssien kokonaismäärä *
                                </label>
                                <input
                                    type="number"
                                    id="license-total"
                                    class="form-control"
                                    min="1"
                                    step="1"
                                    required
                                    value="1"
                                >
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="license-used" class="form-label">
                                    Käytössä olevat *
                                </label>
                                <input
                                    type="number"
                                    id="license-used"
                                    class="form-control"
                                    min="0"
                                    step="1"
                                    required
                                    value="0"
                                >
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="license-renewal" class="form-label">
                                Uusimispäivä
                            </label>
                            <input
                                type="date"
                                id="license-renewal"
                                class="form-control"
                            >
                            <div class="form-text">
                                Päivä, jolloin lisenssi tulee uusia.
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="license-cost" class="form-label">
                                Kustannus (€)
                            </label>
                            <input
                                type="number"
                                id="license-cost"
                                class="form-control"
                                min="0"
                                step="0.01"
                                placeholder="esim. 1200"
                            >
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <button
                                type="button"
                                class="btn btn-secondary"
                                data-bs-dismiss="modal"
                            >
                                Peruuta
                            </button>
                            <button type="submit" class="btn btn-primary">
                                Tallenna lisenssi
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript ladataan viimeisenä -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
