<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Asset Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<>
    
    <header>
        <nav class="navbar">
            <div class="logo">IT Assets</div>
            <ul class="nav-links">
                <li><a href="#" id="nav-dashboard" class="active">Dashboard</a></li>
                <li><a href="#" id="nav-devices">Laitteet</a></li>
                <li><a href="#" id="nav-users">Käyttäjät</a></li>
                <li><a href="#" id="nav-licenses">Lisenssit</a></li>
            </ul>
        </nav>
    </header>

    <main id="app-content">
        <h1>Tervetuloa IT Asset Management -järjestelmään.</h1>
        <p>...</p>
    </main>

    <!-- ======================================================= -->
    <!-- MODAL-IKKUNA LAITTEIDEN HALLINTAAN       -->
    <!-- ======================================================= -->
    <div class="modal fade" id="addDeviceModal" tabindex="-1" role="dialog" aria-labelledby="addDeviceModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h2 class="modal-title" id="addDeviceModalLabel">Lisää uusi IT-laite</h2>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Sulje"></button>
                </div>
                <div class="modal-body">
                    <form id="form-add-device">
                        <!-- Laitetyyppi -->
                        <div class="mb-3">
                            <label for="device-type" class="form-label">Laitetyyppi *</label>
                            <select class="form-select" id="device-type" required>
                                <option value="" disabled selected>Valitse tyyppi...</option>
                                <option value="Tietokone">Tietokone</option>
                                <option value="Puhelin">Puhelin</option>
                                <option value="Tabletti">Tabletti</option>
                                <option value="Muu">Muu laite</option>
                            </select>
                        </div>
                        <!-- Valmistaja ja Malli samalla rivillä -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="device-vendor" class="form-label">Valmistaja *</label>
                                <input type="text" class="form-control" id="device-vendor" required placeholder="esim. Lenovo">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="device-model" class="form-label">Malli *</label>
                                <input type="text" class="form-control" id="device-model" required placeholder="esim. ThinkPad">
                            </div>
                        </div>
                        <!-- Sarjanumero -->
                        <div class="mb-3">
                            <label for="device-serial" class="form-label">Sarjanumero *</label>
                            <input type="text" class="form-control" id="device-serial" required placeholder="esim. SN-12345">
                        </div>
                        <!-- Käyttäjä -->
                        <div class="mb-3">
                            <label for="device-user" class="form-label">Käyttäjä</label>
                            <input type="text" class="form-control" id="device-user" placeholder="esim. Matti Meikäläinen">
                        </div>
                        <!-- Tila ja Hinta -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="device-status" class="form-label">Tila *</label>
                                <select class="form-select" id="device-status" required>
                                    <option value="" disabled>Valitse tila...</option>
                                    <option value="Käytössä">Käytössä</option>
                                    <option value="Varastossa" selected>Varastossa</option>
                                    <option value="Huollossa">Huollossa</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="device-price" class="form-label">Hinta (€)</label>
                                <input type="number" class="form-control" id="device-price" placeholder="esim. 1000">
                            </div>
                        </div>
                        <!-- Päivämäärät -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="device-purchase" class="form-label">Hankintapäivä</label>
                                <input type="date" class="form-control" id="device-purchase">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="device-warranty" class="form-label">Takuu päättyy</label>
                                <input type="date" class="form-control" id="device-warranty">
                            </div>
                        </div>
                        <!-- Lisätiedot -->
                        <div class="mb-3">
                            <label for="device-info" class="form-label">Lisätietoja</label>
                            <textarea class="form-control" id="device-info" rows="2" placeholder="Kuvaus laitteesta..."></textarea>
                        </div>
                        <!-- Painikkeet -->
                        <div class="d-flex justify-content-end gap-2 pt-2">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Peruuta</button>
                            <button type="submit" class="btn btn-primary">Tallenna laite</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>


    <!-- ======================================================= -->
    <!-- MODAL-IKKUNA KÄYTTÄJIEN HALLINTAAN       -->
    <!-- ======================================================= -->

    <div class="modal fade" id="userModal" tabindex="-1" role="dialog" aria-labelledby="userModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h2 class="modal-title" id="userModalLabel">Lisää uusi käyttäjä</h2>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Sulje"></button>
                </div>
                <div class="modal-body">
                    <form id="form-user">
                        <!-- Käyttäjän tiedot -->
                        <div class="mb-3">
                            <label for="user-name" class="form-label">Koko nimi *</label>
                            <input type="text" class="form-control" id="user-name" maxlength="100" required placeholder="esim. Matti Meikäläinen">
                        </div>
                        <div class="mb-3">
                            <label for="user-email" class="form-label">Sähköposti *</label>
                            <input type="email" class="form-control" id="user-email" required placeholder="esim. matti.meikalainen@yritys.fi">
                        </div>
                        <div class="mb-3">
                            <label for="user-department" class="form-label">Osasto</label>
                            <input type="text" class="form-control" id="user-department" placeholder="esim. Myynti">
                        </div>
                        <div class="mb-3">
                            <label for="user-role" class="form-label">Tehtävänimike</label>
                            <input type="text" class="form-control" id="user-role" placeholder="esim. Myyjä">
                        </div>
                            <div class="d-flex justify-content-end gap-2 pt-2">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Peruuta</button>
                            <button type="submit" class="btn btn-primary">Tallenna käyttäjä</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- ======================================================= -->
    <!-- MODAL-IKKUNA LISENSSIEN HALLINTAAN       -->
    <!-- ======================================================= -->
    <div class="modal fade" id="licenseModal" tabindex="-1" role="dialog" aria-labelledby="licenseModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h2 class="modal-title" id="userModalLabel">Lisää ohjelmistolisenssi</h2>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Sulje"></button>
                </div>
                <div class="modal-body">
                    <form id="form-license">
                        <!-- Käyttäjän tiedot -->
                        <div class="mb-3">
                            <label for="license-name" class="form-label">Ohjelmiston nimi *</label>
                            <input type="text" class="form-control" id="license-name" maxlength="100" required placeholder="esim. Microsoft 365">
                        </div>
                        <div class="mb-3">
                            <label for="license-vendor" class="form-label">Toimittaja *</label>
                            <input type="text" class="form-control" id="license-vendor" required placeholder="esim. Microsoft">
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                            <label for="license-total" class="form-label">Lisenssien kokonaismäärä *</label>
                            <input type="number" class="form-control" id="license-total" min="1" step="1" required value="1">
                        </div>
                        <div class="col md-6 mb-3">
                            <label for="license-used" class="form-label">Käytössä olevat *</label>
                            <input type="number" class="form-control" id="license-used" min="0" step="1" required value="0">
                        </div>
                        <div class="mb-3">
                            <label for="license renewal" class="form-label">Uusimispäivä </label>
                            <input type="date" class="form-control" id="license-renewal">
                            <div class="form-text">Päivä, jolloin lisenssi tulee uusia.
                            </div>
                            <div class="mb-3">
                                <label for="license-cost" class="form-label">Kustannus (€) </label>
                                <input type="number" class="form-control" id="license-cost" min="0" step="0.01" placeholder="esim. 1200">
                            </div>
                            <div class="d-flex justify-content-end gap-2 pt-2">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Peruuta</button>
                            <button type="submit" class="btn btn-primary">Tallenna lisenssi</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <!-- Linkitetään JavaScript-tiedostot -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
